[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tdma-schedule-optimizer"
version = "1.0.0"
description = "TDMA Schedule Planner and Optimizer in Python with Distance-2 Spatial Reuse"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
]

[project.optional-dependencies]
opt = [
    "ortools>=9.6",
    "matplotlib>=3.7",
]
test = [
    "pytest>=7.4",
]

[project.scripts]
tdma-cli = "tdma.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
